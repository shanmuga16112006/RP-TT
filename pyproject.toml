[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "timetable-backend"
version = "0.1.0"
description = "Constraint-aware timetable backend with a Flask frontend"
requires-python = ">=3.11"
dependencies = ["flask>=3.0.0"]

[project.scripts]
timetable-api = "backend.timetable.api:main"
timetable-export = "backend.timetable.export:main"
timetable-web = "frontend.app:main"

[tool.setuptools.packages.find]
include = ["backend*", "frontend*"]

[tool.setuptools.package-data]
frontend = ["static/*", "templates/*"]

[tool.pytest.ini_options]
testpaths = ["backend/tests"]
